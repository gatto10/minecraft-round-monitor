name: Build firmware
on:
  workflow_dispatch:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10

      - name: Install libraries
        run: |
          arduino-cli lib install "GFX Library for Arduino"
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "SensorLib"

      - name: Prepare sketch name
        run: mv firmware/MinecraftRoundMonitor.ino firmware/firmware.ino

      - name: Compile
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB" \
            --output-dir build \
            firmware

      - name: Merge flash image
        run: |
          python -m pip install esptool
          python -m esptool --chip esp32s3 merge-bin \
            -o minecraft-monitor-firmware.bin \
            --flash-mode dio --flash-size 16MB --flash-freq 80m \
            0x0 build/firmware.ino.bootloader.bin \
            0x8000 build/firmware.ino.partitions.bin \
            0xe000 /home/runner/.arduino15/packages/esp32/hardware/esp32/3.3.10/tools/partitions/boot_app0.bin \
            0x10000 build/firmware.ino.bin

      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-monitor-firmware
          path: minecraft-monitor-firmware.bin
